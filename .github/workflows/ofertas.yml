name: Actualizar ofertas
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ofertas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar ofertas
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python ofertas.py
      - name: Guardar si cambiaron
        run: |
          git config user.name "Conector ofertas"
          git config user.email "actions@users.noreply.github.com"
          git add -A ofertas vuelos sitemap.xml
          git diff --cached --quiet || (git commit -m "Ofertas actualizadas" && git push)
